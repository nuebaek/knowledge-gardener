<svg id="dg" viewBox="0 0 1840 660" xmlns="http://www.w3.org/2000/svg"><style>:root{--bg:#ffffff;--ink:#1f2430;--sub:#5a6474;--arrow:#3a4152;--dash:#8892a8;--loop:#c2410c;--gray:#eceef2;--grayS:#b7bdc9;--orange:#fde4c8;--orangeS:#e79a4a;--blue:#cfe0fb;--blueS:#6f9de8;--green:#cdeed7;--greenS:#5cbd7e;--store:#e7e5f6;--storeS:#9b8fd8;--pill:#ffffff;--pillS:#7fc9bd;--tool:#d5f0ea;--toolS:#3fae9b;}
  :root{
    --bg:#ffffff; --ink:#1f2430; --sub:#5a6474;
    --arrow:#3a4152; --dash:#8892a8; --loop:#c2410c;
    --gray:#eceef2; --grayS:#b7bdc9;
    --orange:#fde4c8; --orangeS:#e79a4a;
    --blue:#cfe0fb; --blueS:#6f9de8;
    --green:#cdeed7; --greenS:#5cbd7e;
    --store:#e7e5f6; --storeS:#9b8fd8;
    --pill:#ffffff; --pillS:#7fc9bd;
    --tool:#d5f0ea; --toolS:#3fae9b;
  }
  [data-theme="dark"]{
    --bg:#0f131b; --ink:#e8ecf4; --sub:#95a0b5;
    --arrow:#c3cbdb; --dash:#7b869c; --loop:#fb923c;
    --gray:#232936; --grayS:#414a5e;
    --orange:#3a2a15; --orangeS:#a97e34;
    --blue:#16233f; --blueS:#3f63b8;
    --green:#12301f; --greenS:#2f8f57;
    --store:#211d38; --storeS:#5b4fa0;
    --pill:#0d1a17; --pillS:#2f8f80;
    --tool:#0f2e2a; --toolS:#2f8f80;
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  .bar{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap;}
  .bar h1{font-size:16px;margin:0;font-weight:650;}
  .bar .tag{font-size:12px;color:var(--sub);}
  .bar button{font-size:12px;padding:6px 12px;border-radius:8px;
    border:1px solid var(--grayS);background:var(--bg);color:var(--ink);cursor:pointer;}
  .bar .sp{margin-left:auto;}
  .wrap{padding:4px 18px 30px;}
  svg{width:100%;height:auto;display:block;}
  .title{font-size:14.5px;font-weight:700;fill:var(--ink);}
  .sub{font-size:11px;font-weight:500;fill:var(--sub);}
  .pilltxt{font-size:11.5px;font-weight:650;fill:var(--ink);}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .flow{stroke:var(--arrow);stroke-width:2.2;fill:none;}
  .thin{stroke:var(--arrow);stroke-width:1.8;fill:none;}
  .ret{stroke:var(--dash);stroke-width:2;fill:none;stroke-dasharray:7 5;}
  .obs{stroke:var(--dash);stroke-width:1.7;fill:none;stroke-dasharray:2 5;stroke-linecap:round;}
  .loop{stroke:var(--loop);stroke-width:1.8;fill:none;}
  .looptxt{fill:var(--loop);font-size:10.5px;font-weight:700;}
  .badge{fill:#ffffff;font-size:9.5px;font-weight:800;letter-spacing:.8px;}
</style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="var(--arrow)"/></marker>
    <marker id="ahd" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="var(--dash)"/></marker>
    <marker id="ahl" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--loop)"/></marker>
  </defs>

  <!-- ===== connections (under boxes) ===== -->
  <path class="flow" d="M240,308 L296,308" marker-end="url(#ah)"/>              <!-- User->FastAPI -->
  <path class="flow" d="M530,308 L596,308" marker-end="url(#ah)"/>              <!-- FastAPI->Agent -->
  <!-- Agent <-> Memory -->
  <path class="flow" d="M706,258 L706,150" marker-end="url(#ah)"/>
  <path class="flow" d="M730,150 L730,258" marker-end="url(#ah)"/>
  <!-- Agent .. LangSmith (trace) -->
  <path class="obs" d="M718,364 L718,406"/>
  <!-- Agent -> answer_question -->
  <path class="flow" d="M836,290 L872,290 L872,238 L902,238" marker-end="url(#ah)"/>
  <!-- Agent -> write -->
  <path class="flow" d="M836,334 L872,334 L872,420 L902,420" marker-end="url(#ah)"/>
  <!-- answer_question <-> Vector store -->
  <path class="thin" d="M1058,154 L1058,130" marker-end="url(#ah)"/>
  <path class="thin" d="M1158,130 L1158,154" marker-end="url(#ah)"/>
  <!-- write -> markdown store -->
  <path class="flow" d="M1108,482 L1108,514" marker-end="url(#ah)"/>
  <!-- answer_question -> LLM -->
  <path class="flow" d="M1310,238 L1346,238 L1346,290 L1378,290" marker-end="url(#ah)"/>
  <!-- write -> LLM -->
  <path class="flow" d="M1310,420 L1346,420 L1346,334 L1378,334" marker-end="url(#ah)"/>
  <!-- LLM -> Answer -->
  <path class="flow" d="M1604,308 L1636,308" marker-end="url(#ah)"/>
  <!-- Answer -> User (return) -->
  <path class="ret" d="M1730,356 L1730,624 L140,624 L140,358" marker-end="url(#ahd)"/>

  <!-- ===== nodes ===== -->
  <!-- User -->
  <rect x="40" y="262" width="200" height="92" rx="12" fill="var(--gray)" stroke="var(--grayS)" stroke-width="1.6"/>
  <text class="title" x="140" y="302" text-anchor="middle">User</text>
  <text class="sub" x="140" y="323" text-anchor="middle">질문 또는 오늘 배운 내용</text>

  <!-- FastAPI -->
  <rect x="300" y="262" width="230" height="92" rx="12" fill="var(--orange)" stroke="var(--orangeS)" stroke-width="1.6"/>
  <text class="title" x="415" y="302" text-anchor="middle">FastAPI</text>
  <text class="sub mono" x="415" y="323" text-anchor="middle">/corpus · /converse</text>

  <!-- Memory -->
  <rect x="600" y="60" width="236" height="88" rx="12" fill="var(--blue)" stroke="var(--blueS)" stroke-width="1.6"/>
  <text class="title" x="718" y="96" text-anchor="middle">Memory (InMemorySaver)</text>
  <text class="sub mono" x="718" y="116" text-anchor="middle">thread_id 기준 대화 맥락</text>
  <text class="sub" x="718" y="133" text-anchor="middle">체크포인트로 멀티턴 유지</text>

  <!-- Agent -->
  <rect x="600" y="262" width="236" height="102" rx="12" fill="var(--blue)" stroke="var(--blueS)" stroke-width="1.6"/>
  <text class="title" x="718" y="300" text-anchor="middle">LangGraph Agent</text>
  <text class="sub" x="718" y="321" text-anchor="middle">tools_condition 으로</text>
  <text class="sub" x="718" y="338" text-anchor="middle">검색 · 저장 · 직접응답 라우팅</text>

  <!-- LangSmith -->
  <rect x="600" y="408" width="236" height="52" rx="10" fill="var(--gray)" stroke="var(--grayS)" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text class="sub" x="718" y="430" text-anchor="middle" style="font-weight:700;fill:var(--ink);">LangSmith</text>
  <text class="sub" x="718" y="448" text-anchor="middle">전 실행 트레이싱</text>

  <!-- Vector store -->
  <rect x="906" y="38" width="404" height="90" rx="12" fill="var(--store)" stroke="var(--storeS)" stroke-width="1.6"/>
  <text class="title" x="1108" y="72" text-anchor="middle">Vector DB (ChromaDB)</text>
  <text class="sub mono" x="1108" y="92" text-anchor="middle">chroma_data/ (on disk)</text>
  <text class="sub" x="1108" y="110" text-anchor="middle">Embeddings: BAAI/bge-m3 (local)</text>

  <!-- answer_question (RAG tool) -->
  <rect x="906" y="156" width="404" height="164" rx="12" fill="var(--tool)" stroke="var(--toolS)" stroke-width="1.8"/>
  <rect x="924" y="171" width="44" height="18" rx="6" fill="var(--toolS)"/>
  <text class="badge" x="946" y="183.5" text-anchor="middle">TOOL</text>
  <text class="title mono" x="978" y="184" text-anchor="start">answer_question</text>
  <!-- pills -->
  <rect x="924" y="206" width="112" height="38" rx="9" fill="var(--pill)" stroke="var(--pillS)" stroke-width="1.3"/>
  <text class="pilltxt mono" x="980" y="229" text-anchor="middle">retrieve</text>
  <rect x="1058" y="206" width="118" height="38" rx="9" fill="var(--pill)" stroke="var(--pillS)" stroke-width="1.3"/>
  <text class="pilltxt mono" x="1117" y="229" text-anchor="middle">grade_docs</text>
  <rect x="1198" y="206" width="96" height="38" rx="9" fill="var(--pill)" stroke="var(--pillS)" stroke-width="1.3"/>
  <text class="pilltxt mono" x="1246" y="229" text-anchor="middle">generate</text>
  <path class="thin" d="M1036,225 L1056,225" marker-end="url(#ah)"/>
  <path class="thin" d="M1176,225 L1196,225" marker-end="url(#ah)"/>
  <!-- retry loop: grade_docs -> back to retrieve -->
  <path class="loop" style="stroke-linejoin:round" d="M1117,244 L1117,268 L980,268 L980,248" marker-end="url(#ahl)"/>
  <text class="looptxt" x="1108" y="304" text-anchor="middle">관련도 &lt; 0.4 → rewrite_query 재검색 (최대 2회)</text>

  <!-- write tool -->
  <rect x="906" y="360" width="404" height="122" rx="12" fill="var(--tool)" stroke="var(--toolS)" stroke-width="1.8"/>
  <rect x="924" y="383" width="44" height="18" rx="6" fill="var(--toolS)"/>
  <text class="badge" x="946" y="395.5" text-anchor="middle">TOOL</text>
  <text class="title mono" x="978" y="396" text-anchor="start" style="font-size:13.5px;">write_daily · write_weekly · write_til</text>
  <text class="sub" x="1108" y="420" text-anchor="middle">회고형 발화를 구조화 → writer.py 호출</text>
  <text class="sub" x="1108" y="437" text-anchor="middle">LLM이 markdown 본문 + frontmatter 작성</text>
  <text class="sub" x="1108" y="461" text-anchor="middle">학습일지 저장</text>

  <!-- markdown store -->
  <rect x="906" y="516" width="404" height="82" rx="12" fill="var(--store)" stroke="var(--storeS)" stroke-width="1.6"/>
  <text class="title" x="1108" y="550" text-anchor="middle">학습일지 파일</text>
  <text class="sub mono" x="1108" y="572" text-anchor="middle">data/writer/{daily,weekly,til}/*.md</text>

  <!-- LLM -->
  <rect x="1380" y="262" width="224" height="102" rx="12" fill="var(--green)" stroke="var(--greenS)" stroke-width="1.6"/>
  <text class="title" x="1492" y="300" text-anchor="middle">LLM</text>
  <text class="sub" x="1492" y="321" text-anchor="middle">답변 · 저장 확인 문구 생성</text>
  <text class="sub mono" x="1492" y="341" text-anchor="middle">Gemini · Ollama · Cerebras</text>

  <!-- Answer -->
  <rect x="1640" y="262" width="180" height="92" rx="12" fill="var(--green)" stroke="var(--greenS)" stroke-width="1.6"/>
  <text class="title" x="1730" y="314" text-anchor="middle">Answer</text>
</svg>