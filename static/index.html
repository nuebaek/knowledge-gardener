<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🌱 Knowledge Gardener</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>" />
  <meta name="description" content="질문에는 근거를, 학습 기록에는 저장할 자리를 주는 개인 학습 에이전트" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div id="root-app" class="app">
    <header class="head">
      <div class="head-main">
        <h1 class="title"><span class="title-dot" aria-hidden="true"></span>Knowledge Gardener</h1>
        <p class="sub">근거로 답하고, 기록으로 남깁니다.</p>
      </div>
      <div class="head-meta">
        <span class="corpus-tag" id="corpus-tag" hidden></span>
      </div>
    </header>

    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

    <main class="transcript" id="transcript">
      <div class="transcript-inner" id="transcript-inner">
        <div class="empty" id="empty-state">
          <div class="empty-seed" aria-hidden="true">
            <span class="empty-glow"></span>
            <span class="empty-stub"></span>
          </div>
          <p class="empty-text">질문하거나, 오늘 배운 내용을 정리해보세요.</p>
          <p class="empty-hint">근거가 있으면 답하고, 기록할 내용이면 저장해둡니다.</p>
          <div class="examples" id="examples" role="group" aria-label="질문 예시" hidden></div>
        </div>
      </div>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="message">메시지 입력</label>
      <div class="prompt-bar">
        <span class="prompt-caret" aria-hidden="true">&gt;</span>
        <input id="message" name="message" type="text" placeholder="질문 또는 오늘 배운 내용" required />
        <button type="submit" id="submit-btn" aria-label="보내기">↵</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="/app.js"></script>
</body>

</html>
