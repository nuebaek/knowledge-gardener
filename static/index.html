<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🌱 Knowledge Gardener</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>" />
  <meta name="description" content="질문에는 근거를, 학습 기록에는 저장할 자리를 주는 개인 학습 에이전트" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mind-elixir/dist/MindElixir.css" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div id="root-app" class="app">
    <nav class="rail" aria-label="패널 전환" id="rail">
      <div class="rail-mark" aria-hidden="true">
        <svg class="rail-mark-sprout" viewBox="0 0 48 64" width="24" height="32" aria-hidden="true">
          <path class="rail-mark-leaf" d="M24 36 C 12 36, 6 26, 8 13 C 19 15, 25 24, 24 36 Z" />
          <path class="rail-mark-leaf" d="M24 28 C 36 28, 42 19, 40 8 C 30 10, 24 17, 24 28 Z" />
          <path class="rail-mark-stem" d="M24 58 L24 21" />
        </svg>
      </div>

      <div class="rail-tabs" role="tablist" aria-label="패널" aria-orientation="vertical">
        <span class="rail-indicator" id="rail-indicator" aria-hidden="true"></span>
        <button type="button" class="rail-tab" id="tab-chat" role="tab" aria-selected="false" tabindex="-1"
          aria-controls="panel-chat" data-panel="chat">
          <svg class="rail-tab-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3.5 5.5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-3 3v-3h-.5a2 2 0 0 1-2-2v-6Z"
              stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
          </svg>
          <span class="rail-tab-label">채팅</span>
        </button>
        <button type="button" class="rail-tab" id="tab-documents" role="tab" aria-selected="true" tabindex="0"
          aria-controls="panel-documents" data-panel="documents">
          <svg class="rail-tab-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M6 2.5h5.5L15 6v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Z"
              stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
            <path d="M11.5 2.5V6H15" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
            <path d="M7.5 10h5M7.5 13h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          <span class="rail-tab-label">문서</span>
        </button>
      </div>

      <div class="rail-foot">
        <span class="corpus-tag" id="corpus-tag" hidden></span>
      </div>
    </nav>

    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

    <section class="panel" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat" tabindex="0" hidden>
      <header class="panel-head">
        <div class="panel-head-main">
          <h1 class="panel-title"><span class="title-dot" aria-hidden="true"></span>Knowledge Gardener</h1>
          <p class="panel-sub">근거로 답하고, 기록으로 남깁니다.</p>
        </div>
        <button type="button" class="new-chat-btn" id="new-chat-btn">
          <span class="new-chat-icon" aria-hidden="true">+</span>새 채팅
        </button>
      </header>

      <main class="transcript" id="transcript">
        <div class="transcript-inner" id="transcript-inner">
          <div class="empty" id="empty-state">
            <svg class="sprout-mark" viewBox="0 0 48 64" width="48" height="64" aria-hidden="true">
              <path class="sprout-leaf sprout-leaf-l"
                d="M24 36 C 12 36, 6 26, 8 13 C 19 15, 25 24, 24 36 Z" />
              <path class="sprout-leaf sprout-leaf-r"
                d="M24 28 C 36 28, 42 19, 40 8 C 30 10, 24 17, 24 28 Z" />
              <path class="sprout-stem" d="M24 58 L24 21" />
              <circle class="sprout-seed" cx="24" cy="58" r="4" />
            </svg>
            <p class="empty-text">질문하거나, 오늘 배운 내용을 정리해보세요.</p>
            <p class="empty-hint">근거가 있으면 답하고, 기록할 내용이면 저장해둡니다.</p>
            <div class="examples" id="examples" role="group" aria-label="질문 예시" hidden></div>
          </div>
        </div>
      </main>

      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="message">메시지 입력</label>
        <div class="prompt-bar">
          <textarea id="message" name="message" placeholder="질문 또는 오늘 배운 내용" rows="1" required></textarea>
          <button type="submit" id="submit-btn" aria-label="보내기">↑</button>
        </div>
      </form>
    </section>

    <section class="panel" id="panel-documents" role="tabpanel" aria-labelledby="tab-documents" tabindex="0">
      <header class="panel-head">
        <div class="panel-head-main">
          <h1 class="panel-title">문서함</h1>
          <p class="panel-sub">코퍼스에 색인된 원문을 그대로 확인합니다.</p>
        </div>
        <div class="panel-head-meta" id="doc-count-tag"></div>
      </header>

      <div class="doc-search-bar" id="doc-search-bar">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <label class="sr-only" for="doc-search-input">문서 검색</label>
        <input id="doc-search-input" type="text" placeholder="키워드로 문서 검색" autocomplete="off" />
      </div>

      <div class="doc-filter-row">
        <div class="doc-folder-tabs" id="doc-folder-tabs" role="tablist" aria-label="문서 폴더"></div>
        <button type="button" class="tag-filter-pill" id="tag-filter-pill" hidden>
          <span id="tag-filter-label"></span><span class="tag-filter-clear" aria-hidden="true">×</span>
        </button>
      </div>

      <div class="doc-layout">
        <div class="doc-list" id="doc-list" aria-label="문서 목록"></div>
        <div class="doc-reader" id="doc-reader">
          <div class="doc-reader-empty" id="doc-reader-empty">
            <svg class="empty-sprout" viewBox="0 0 48 64" width="28" height="37" aria-hidden="true">
              <path class="empty-sprout-leaf" d="M24 36 C 12 36, 6 26, 8 13 C 19 15, 25 24, 24 36 Z" />
              <path class="empty-sprout-leaf" d="M24 28 C 36 28, 42 19, 40 8 C 30 10, 24 17, 24 28 Z" />
              <path class="empty-sprout-stem" d="M24 58 L24 21" />
              <circle class="empty-sprout-seed" cx="24" cy="58" r="4" />
            </svg>
            <p class="empty-text">왼쪽에서 문서를 선택하면 원문을 보여드립니다.</p>
          </div>
          <article class="doc-reader-body" id="doc-reader-body" hidden></article>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script type="module">
    // mind-elixir is ESM-only, unlike the other UMD CDN libs above — loaded via
    // dynamic import inside this function so it only downloads when actually used.
    window.renderMindmapInto = async function (container, plaintext) {
      const [{ default: MindElixir }, { plaintextToMindElixir }] = await Promise.all([
        import("https://cdn.jsdelivr.net/npm/mind-elixir/dist/MindElixir.js"),
        import("https://cdn.jsdelivr.net/npm/mind-elixir/dist/PlaintextConverter.js"),
      ]);
      const data = plaintextToMindElixir(plaintext);
      const mind = new MindElixir({ el: container, direction: MindElixir.SIDE });
      mind.init(data);
      mind.scaleFit(); // not sized to the container right after init otherwise
      return mind;
    };
  </script>
  <script src="/app.js"></script>
</body>

</html>
